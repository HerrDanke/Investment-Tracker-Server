services:
  investment-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: investment-tracker:latest
    container_name: investment-tracker
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - investment-data:/app/data
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  investment-data:
    driver: local
